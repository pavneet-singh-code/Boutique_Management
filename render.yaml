# Render Blueprint for the Fab_art backend (FastAPI).
# The data lives in Neon Postgres (DATABASE_URL); Render's own disk is not used.
services:
  - type: web
    name: fabart-backend
    runtime: python
    plan: free
    region: singapore  # closest Render region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      # Secrets: entered by hand in the Render dashboard, never stored in git.
      - key: DATABASE_URL  # Neon connection string (postgresql://...)
        sync: false
      - key: JWT_SECRET_KEY  # same value as on PythonAnywhere, so logins keep working
        sync: false
      - key: FAB_ART_PASSWORD_HASH  # same value as on PythonAnywhere
        sync: false
      - key: GEMINI_API_KEY
        sync: false
